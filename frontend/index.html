<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <!-- HEADER -->

        <h1>💜 Expense Tracker</h1>

        <p class="subtitle">
            Track your spending. Manage your money. Reach your goals.
        </p>


        <div class="dashboard">
            <!-- TOTAL EXPENSES -->

<div class="total-card">

    <h2>💰 Total Spent</h2>

    <p id="totalAmount">₹0.00</p>

</div>
<div class="total-card">

    <h2>🧾 Expenses</h2>

    <p id="expenseCount">0</p>

</div>


            <!-- ADD EXPENSE CARD -->

            <div class="card">

                <div class="visual">

                    <div class="money-icon">
                        💰
                    </div>

                    <h2>Add New Expense</h2>

                </div>


                <form id="expenseForm">


                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Expense Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Example: Lunch"
                            required
                        >

                    </div>


                    <!-- AMOUNT -->

                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="Example: 150"
                            min="1"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>

                            <option value="">
                                Choose category
                            </option>

                            <option value="Food">
                                🍔 Food
                            </option>

                            <option value="Travel">
                                🚗 Travel
                            </option>

                            <option value="Shopping">
                                🛍️ Shopping
                            </option>

                            <option value="Education">
                                📚 Education
                            </option>

                            <option value="Bills">
                                💡 Bills
                            </option>

                            <option value="Other">
                                ✨ Other
                            </option>

                        </select>

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="3"
                            placeholder="Add a small description..."
                        ></textarea>

                    </div>


                    <!-- SUBMIT BUTTON -->

                    <button type="submit">
                        ➕ Add Expense
                    </button>


                </form>

            </div>



            <!-- EXPENSE LIST CARD -->

            <div class="card">

                <h2>📊 Your Expenses</h2>


                <div id="expenseList">

                    <!-- Expenses will be loaded here
                         using JavaScript -->

                </div>


            </div>


        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
